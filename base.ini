; base.ini for the slim canvas2d build.
; Every asset this build needs is in this folder: data.zip / maps.zip /
; languages.zip, the img_pack/ + aud_pack/ media packs (rebuilt smaller by
; tools/build_slim_packs.js), movies/, fonts/ and icon/.
; baseUrl is empty on purpose: nothing is fetched from a CDN, so the build also
; runs from a plain static file server (or file:// for the archives that are read
; through fetch).
baseUrl=
useRemoteParts=false
accountId=

; How many part downloads may run at once (1-16).
concurrency=6

; Persist combined archives in IndexedDB so repeat boots skip the download.
cacheEnabled=true
